name: Release CLI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Pull requests that cannot change the release executable skip this workflow.
    # It is not a required check, so skipping never blocks a merge. Pushes to main
    # are unfiltered: every main commit gets the full release-profile verification.
    paths:
      - src-tauri/**
      - scripts/**
      - package.json
      - package-lock.json
      - .github/workflows/release-cli.yml
      - .github/actions/**

permissions:
  contents: read

# Newer pushes replace older PR runs; every main commit keeps its own uncancelled run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-cli:
    name: ${{ matrix.platform }} release CLI
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Type-checking is done once by the Build workflow; only the bundle is needed here.
      - uses: ./.github/actions/frontend-bg
        with:
          phase: start
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-cli-${{ matrix.platform }}
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/frontend-bg
        with:
          phase: wait
      - name: Ensure the Windows Tauri CLI binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if node -e "require('@tauri-apps/cli-win32-x64-msvc')" 2>/dev/null; then exit 0; fi
          CLI_VERSION="$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")"
          curl -fLsS "https://registry.npmjs.org/@tauri-apps/cli-win32-x64-msvc/-/cli-win32-x64-msvc-${CLI_VERSION}.tgz" -o cli-win32.tgz
          mkdir -p node_modules/@tauri-apps/cli-win32-x64-msvc
          tar -xzf cli-win32.tgz -C node_modules/@tauri-apps/cli-win32-x64-msvc --strip-components=1
          node -e "require('@tauri-apps/cli-win32-x64-msvc')"
      - name: Build actual release executable (Linux)
        if: runner.os != 'Windows'
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Build actual release executable (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle -- --locked
      - name: Test release CLI with captured stdout and stderr
        shell: bash
        run: |
          BINARY=src-tauri/target/release/agy-switch-desktop
          if [[ "$RUNNER_OS" == Windows ]]; then BINARY="${BINARY}.exe"; fi
          node scripts/test-cli.mjs "$BINARY"
      - name: Test interactive CLI in a real terminal
        timeout-minutes: 2
        shell: bash
        run: |
          BINARY=src-tauri/target/release/agy-switch
          if [[ "$RUNNER_OS" == Windows ]]; then BINARY="$BINARY.exe"; fi
          node scripts/test-cli-terminal.mjs "$BINARY"
          node scripts/test-cli-account-window.mjs "$BINARY"

      - name: Test dedicated Windows console CLI in PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-cli.ps1 -Binary ./src-tauri/target/release/agy-switch.exe -Console
      - name: Test Windows release CLI with explicit PowerShell waiting
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-cli.ps1 -Binary ./src-tauri/target/release/agy-switch-desktop.exe

      - name: Upload Windows release binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agy-switch-windows-x64
          path: |
            src-tauri/target/release/agy-switch.exe
            src-tauri/target/release/agy-switch-desktop.exe
          if-no-files-found: error
